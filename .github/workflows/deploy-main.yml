name: Deploy game backend to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-game-backend-production
  cancel-in-progress: true

jobs:
  build:
    name: Check production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Pull, build and restart PM2
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /var/www/game-backend
          git pull --ff-only origin main

          npm ci
          npm run build
          pm2 reload lapa-play-game-backend --update-env
          REMOTE
